<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Serkit</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <main id="app">
     <div class="unit">

      <!-- ════ VISUAL ════ -->
      <div id="stage"></div>

      <!-- ════ CONTROLS ════ -->
      <section class="deck">

        <header class="unit-head">
          <span class="brand">SERKIT</span>
          <span class="status"><i class="dot"></i>LIVE</span>
        </header>

        <!-- Always visible: track player + save -->
        <div class="player">
          <button class="play-btn" id="dj-play" aria-label="Play track">▶</button>
          <select class="track-select" id="dj-track" aria-label="Track"></select>
          <label class="vol">
            <span>VOL</span>
            <input type="range" id="dj-vol" min="0" max="100" step="1" value="80">
          </label>
          <button class="save-btn" id="dj-save">SAVE PNG</button>
        </div>

        <!-- Tabs -->
        <nav class="tabs" role="tablist">
          <button class="tab active" data-tab="video">Video</button>
          <button class="tab" data-tab="color">Color</button>
          <button class="tab" data-tab="fx">FX</button>
          <button class="tab" data-tab="type">Type</button>
          <button class="tab" data-tab="mirror">Mirror</button>
        </nav>

        <div class="panels">

        <!-- Video -->
        <div class="panel active" data-panel="video">
          <div class="grid-3" id="dj-folders"></div>
          <div class="row">
            <span class="row-label">Clip</span>
            <div class="clips" id="dj-vids"></div>
            <button class="btn btn-cam" id="dj-live">◉ LIVE CAM</button>
          </div>
        </div>

        <!-- Color -->
        <div class="panel" data-panel="color">
          <div class="grid-3" id="dj-palettes"></div>
        </div>

        <!-- FX -->
        <div class="panel" data-panel="fx">
          <div class="knob-grid" id="dj-fx-knobs"></div>
          <p class="hint">Drag a knob up or down. Double-click to reset.</p>
        </div>

        <!-- Type -->
        <div class="panel" data-panel="type">
          <div class="grid-4" id="dj-layer-pads"></div>
          <p class="hint" id="dj-editing"></p>
          <div class="grid-5" id="dj-mode-pads"></div>
          <div class="type-edit">
            <div class="knob-row" id="dj-layer-knobs"></div>
            <div class="xy">
              <label class="xy-row">
                <span>X</span>
                <input type="range" id="dj-posx" min="-600" max="600" step="10" value="0">
                <output id="dj-posx-val">0</output>
              </label>
              <label class="xy-row">
                <span>Y</span>
                <input type="range" id="dj-posy" min="-800" max="800" step="10" value="0">
                <output id="dj-posy-val">0</output>
              </label>
            </div>
          </div>
        </div>

        <!-- Mirror -->
        <div class="panel" data-panel="mirror">
          <div class="grid-5" id="dj-mirror"></div>
        </div>

        </div>

      </section>
     </div>
    </main>
    <script src="sketch.js"></script>
  </body>
</html>
